<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>模拟阅卷平台 · 打分板给分</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f4; color: #1c1917; }
  .header { display: flex; gap: 24px; padding: 10px 20px; background: #065f46; color: #fff; }
  .layout { display: flex; gap: 16px; padding: 16px 20px; }
  .paper { flex: 1; background: #fff; padding: 12px; border-radius: 8px; }
  .paper img { width: 100%; display: block; border: 1px solid #e7e5e4; }
  .side { width: 260px; background: #fff; padding: 16px; border-radius: 8px; align-self: start; }
  .score-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .score-board button { padding: 12px 0; font-size: 18px; border: 1px solid #a8a29e; background: #fafaf9; border-radius: 6px; cursor: pointer; }
  .score-board button:hover { background: #d1fae5; }
  .auto { margin-top: 12px; font-size: 13px; color: #57534e; }
  .log { margin-top: 12px; font-size: 12px; max-height: 240px; overflow: auto; border-top: 1px solid #e7e5e4; padding-top: 8px; }
</style>
</head>
<body>
<div class="header">
  <b>模拟阅卷平台（打分板）</b>
  <span class="exam">2026 秋季期中考试 高二语文</span>
  <span>第 <span class="qno">17</span> 题</span>
  <span class="full">满分 6 分</span>
</div>
<div class="layout">
  <div class="paper"><img class="answer" alt="学生答卷" /></div>
  <div class="side">
    <div>点击分数即提交（平台「自动提交」已开启）</div>
    <div class="score-board" role="group" aria-label="打分板"></div>
    <div class="auto"><label><input type="checkbox" checked disabled /> 自动提交</label></div>
    <div class="log" aria-live="polite"></div>
  </div>
</div>
<script src="papers.js"></script>
<script>
  const img = document.querySelector('.paper img.answer');
  const board = document.querySelector('.score-board');
  const log = document.querySelector('.log');
  let i = 0;
  for (let s = 0; s <= 6; s++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(s);
    b.addEventListener('click', () => submit(s));
    board.appendChild(b);
  }
  function render() { img.src = paperDataUrl(PAPERS[i], i); }
  function submit(s) {
    const line = document.createElement('div');
    line.textContent = `第 ${i + 1} 份：${s} 分`;
    log.prepend(line);
    board.querySelectorAll('button').forEach((b) => (b.disabled = true));
    setTimeout(() => {
      board.querySelectorAll('button').forEach((b) => (b.disabled = false));
      if (i + 1 >= PAPERS.length) { img.removeAttribute('src'); alert('本题已全部阅完'); return; }
      i += 1;
      render();
    }, 500);
  }
  render();
</script>
</body>
</html>
